<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
  <title id="title">Authority flywheel</title>
  <desc id="description">A circular workflow moving through publish evidence, earn references, gain visibility, and measure outcomes.</desc>
  <defs>
    <radialGradient id="hub" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#17464d"/>
      <stop offset="1" stop-color="#10272d"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1df9f8"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#10121b"/>
  <circle cx="500" cy="360" r="250" fill="none" stroke="#17333d" stroke-width="2" stroke-dasharray="5 12"/>

  <g fill="none" stroke="#1df9f8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M570 126 C690 148 780 220 807 292"/>
    <path d="M807 428 C780 500 690 572 570 594"/>
    <path d="M430 594 C310 572 220 500 193 428"/>
    <path d="M193 292 C220 220 310 148 430 126"/>
  </g>

  <g fill="#121827" stroke="#238991" stroke-width="3">
    <circle cx="500" cy="110" r="86"/>
    <circle cx="820" cy="360" r="86"/>
    <circle cx="500" cy="610" r="86"/>
    <circle cx="180" cy="360" r="86"/>
  </g>

  <circle cx="500" cy="360" r="116" fill="url(#hub)" stroke="#1df9f8" stroke-width="4" filter="url(#glow)"/>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#aeb4c7" font-size="17" font-weight="750">
      <text x="500" y="91">01</text>
      <text x="820" y="341">02</text>
      <text x="500" y="591">03</text>
      <text x="180" y="341">04</text>
    </g>
    <g fill="#f5f6fb" font-size="21" font-weight="750">
      <text x="500" y="120"><tspan x="500">Publish</tspan><tspan x="500" dy="27">evidence</tspan></text>
      <text x="820" y="370"><tspan x="820">Earn</tspan><tspan x="820" dy="27">references</tspan></text>
      <text x="500" y="620"><tspan x="500">Gain</tspan><tspan x="500" dy="27">visibility</tspan></text>
      <text x="180" y="370"><tspan x="180">Measure</tspan><tspan x="180" dy="27">outcomes</tspan></text>
    </g>
    <text x="500" y="350" fill="#1df9f8" font-size="18" font-weight="850" letter-spacing="3">AUTHORITY</text>
    <text x="500" y="389" fill="#f5f6fb" font-size="31" font-weight="850">FLYWHEEL</text>
    <text x="500" y="421" fill="#aeb4c7" font-size="15">Build, verify, learn, repeat.</text>
  </g>
</svg>
